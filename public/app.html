<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIVORA — Sistem Pesanan & Untung Kuih</title>
  <meta name="description" content="Sistem pengurusan pesanan, kos resipi dan untung bersih untuk peniaga kuih Malaysia.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" type="image/png" href="/img/nivora-favicon.png">
</head>
<body>
  <div class="boot" id="boot">
    <div class="boot-inner">
      <div class="boot-mark"><img src="/img/nivora-mark.png" alt="NIVORA"></div>
      <div>Menyediakan papan pemuka…</div>
    </div>
  </div>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <img src="/img/nivora-mark.png" alt="NIVORA">
        </div>
        <div>
          <div class="brand-name">NIV<span>ORA</span></div>
          <div class="brand-sub" id="brandSub">Pesanan & Untung Kuih</div>
        </div>
      </div>

      <div id="sidebarNav"></div>

      <div class="sidebar-foot">
        <div class="shop-chip">
          <div class="avatar" id="shopAvatar">OT</div>
          <div class="grow" style="min-width:0">
            <div class="shop-chip-name ellipsis" id="shopName">Kedai</div>
            <div class="shop-chip-role" id="shopRole">Peniaga</div>
          </div>
          <button class="icon-btn sidebar-logout" id="logoutBtn" title="Log keluar" aria-label="Log keluar"></button>
        </div>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebarScrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Buka menu"></button>
        <div>
          <div class="topbar-title" id="pageTitle">Papan Pemuka</div>
          <div class="topbar-crumb" id="pageCrumb">NIVORA</div>
        </div>
        <div class="topbar-right">
          <span class="role-chip" id="roleChip"></span>
          <span class="topbar-date" id="dateChip"></span>
          <a class="icon-btn bordered" id="publicLink" title="Buka borang pesanan pelanggan" aria-label="Borang pelanggan" hidden></a>
          <div class="avatar avatar-dark" id="topAvatar" title="Akaun">OT</div>
        </div>
      </header>

      <main class="page" id="view"></main>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <!-- Pembantu data -->
  <button class="assistant-fab" id="assistantFab" hidden aria-label="Buka pembantu data">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l1.8 4.6L18 9.4l-4.2 1.8L12 16l-1.8-4.8L6 9.4l4.2-1.8L12 3Z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/>
    </svg>
  </button>

  <div class="assistant-panel" id="assistantPanel" hidden>
    <div class="assistant-head">
      <div class="avatar">NV</div>
      <div class="grow">
        <div class="assistant-head-title">Pembantu NIVORA</div>
        <div class="assistant-head-sub" id="assistantStatus">Berasaskan data kedai anda</div>
      </div>
      <button class="icon-btn" id="assistantClose" style="color:#94a3b8" aria-label="Tutup pembantu">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="assistant-body" id="assistantBody"></div>
    <div class="assistant-chips" id="assistantChips"></div>
    <div class="assistant-compose">
      <div class="row">
        <textarea id="assistantInput" rows="1" placeholder="Tanya kos, untung atau pesanan…"></textarea>
        <button class="btn btn-primary" id="assistantSend" aria-label="Hantar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        </button>
      </div>
      <div class="tiny muted center" style="margin-top:6px">Jawapan dikira daripada data pesanan & resipi anda</div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
