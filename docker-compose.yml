services:
  nivora:
    build: .
    image: nivora-kuih:1.0.0
    container_name: nivora-kuih
    restart: unless-stopped
    ports:
      - "8080:4173"
    environment:
      NODE_ENV: production
      PORT: 4173
      HOST: 0.0.0.0
      DB_FILE: /data/nivora.db
      # Demo diakses melalui HTTPS tunnel tetapi origin ialah HTTP,
      # jadi cookie tidak ditanda Secure. Set "true" untuk deployment HTTPS sahaja.
      COOKIE_SECURE: "false"
      SESSION_TTL_DAYS: "7"
    volumes:
      - nivora-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 15s

volumes:
  nivora-data:
